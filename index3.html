<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online - Kartu Produk</title>
  <link rel="stylesheet" href="stayle3.css">
</head>
<body>

  <div class="product-container">

    <div class="product-card">
      <span class="badge-discount">Diskon 20%</span>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSn47hUx_ebEE9hEqSmF2qKdyT4OGvZ08QYife-ssxriA&s=10" alt="Sepatu Sneakers" class="product-img">
      <div class="product-details">
        <h2 class="product-title">Sepatu Sneakers Urban Pro</h2>
        <p class="product-price">Rp 450.000</p>
        <button class="btn-add-to-cart">Masukkan keranjang</button>
      </div>
    </div>

    <div class="product-card">
        <span class="badge-discount">Diskon 10%</span>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQP_T03mu18pK5IMemAd6sF2lYYfnN743SCiUDMvNkvLQ&s=10" alt="Jam Tangan" class="product-img">
      <div class="product-details">
        <h2 class="product-title">Jam Tangan Kasual Minimalis</h2>
        <p class="product-price">Rp 750.000</p>
        <button class="btn-add-to-cart">Masukkan keranjang</button>
      </div>
    </div>

    <div class="product-card">
        <span class="badge-discount">Diskon 30%</span>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhpcso6NZvAh5il0hB68CsYhdVWKpDe35a4P6AwpT-oQ&s=10" alt="Ransel Laptop" class="product-img">
      <div class="product-details">
        <h2 class="product-title">Ransel Laptop Anti Air</h2>
        <p class="product-price">Rp 550.000</p>
        <button class="btn-add-to-cart">Masukkan keranjang</button>
      </div>
    </div>

  </div>

</body>
</html>
