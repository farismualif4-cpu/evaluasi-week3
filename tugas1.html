<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Profil Santri</title>
  <link rel="stylesheet" href="stayle.css">

</head>
<body>

  <div class="card-santri">
    
    <div class="card-header">
      <img 
        src="photo .jpeg" 
        alt="Foto Santri" 
        class="profile-img">
    </div>

    <div class="card-body">
      <h2 class="santri-name">faris mualif</h2>
      <p class="santri-id">NIS: 202610092</p>
      
      <span class="badge-pondok"> • pondok IT</span>

      <div class="motto-box">
        "Sebaik-baik kalian adalah yang mempelajari Al-Qur'an dan mengajarkannya."
      </div>

      <div class="info-grid">

           <div class="info-item">
                <span class="info-label">Capaian Tahfidz</span>
                <span class="info-value">30 Juz</span>
            </div>

            <div class="info-item">
                <span class="info-label">Status</span>
                <span class="info-value">Santri Aktif</span>
            </div>

            <div class="info-item">
                <span class="info-label">Asal Daerah</span>
                <span class="info-value">bekasi</span>
                </div>

            <div class="info-item">
                <span class="info-label">Pembimbing</span>
                <span class="info-value">ustadz maftukhin</span>
            </div>

            <div class="footer">
                <a href="beranda">beranda</a>
                <a href="kontak">kontak</a>
                <a href="galeri">galeri</a>
            </div>
      </div>
    </div>

  </div>

</body>
</html>
